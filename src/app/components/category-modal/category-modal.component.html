<div
  *ngIf="showModal"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
  (click)="onBackdropClick($event)"
>
  <div
    class="bg-white/95 backdrop-blur-2xl rounded-2xl shadow-2xl border border-white/20 max-w-md w-full max-h-[80vh] overflow-hidden"
  >
    <!-- Header with search -->
    <div class="p-6 border-b border-white/10">
      <h2 class="text-xl font-bold text-gray-900 mb-4">Sélectionner une Catégorie</h2>
      <div class="relative">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          name="searchQuery"
          (input)="filterCategories()"
          placeholder="Rechercher une catégorie..."
          class="w-full px-4 py-2 bg-white/50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
        />
        <div class="absolute right-3 top-3 text-gray-400 pointer-events-none">🔍</div>
      </div>
    </div>

    <!-- Categories list -->
    <div class="max-h-96 overflow-y-auto">
      @if (filteredCategories.length === 0) {
      <div class="p-6 text-center text-gray-500">
        Aucune catégorie trouvée
      </div>
      } @else {
      @for (category of filteredCategories; track category.id) {
      <div
        class="p-4 border-b border-white/10 last:border-b-0 hover:bg-purple-50 cursor-pointer transition-colors"
        (click)="selectCategory(category)"
      >
        <div class="font-semibold text-gray-900">{{ category.libelle }}</div>
        @if (category.description) {
        <p class="text-sm text-gray-600 mt-1">{{ category.description }}</p>
        }
      </div>
      }
      }
    </div>

    <!-- Close button -->
    <div class="p-4 border-t border-white/10 text-center">
      <button
        (click)="closeModal()"
        class="text-gray-500 hover:text-gray-700 text-sm"
      >
        Annuler
      </button>
    </div>
  </div>
</div>
